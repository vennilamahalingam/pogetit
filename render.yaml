# Render blueprint for the PoGetIt backend (free plan, no card needed).
# The Firebase key is NOT in git: add it in the Render dashboard as a Secret File
# named serviceAccountKey.json — Render mounts it at /etc/secrets/serviceAccountKey.json.
services:
  - type: web
    name: pogetit-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: SERVICE_ACCOUNT_PATH
        value: /etc/secrets/serviceAccountKey.json
